<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en Mantenimiento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .background-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 20s infinite ease-in-out;
        }

        .circle:nth-child(1) {
            width: 80px;
            height: 80px;
            left: 10%;
            top: 20%;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 120px;
            height: 120px;
            right: 15%;
            top: 40%;
            animation-delay: 2s;
        }

        .circle:nth-child(3) {
            width: 60px;
            height: 60px;
            left: 20%;
            bottom: 20%;
            animation-delay: 4s;
        }

        .circle:nth-child(4) {
            width: 100px;
            height: 100px;
            right: 25%;
            bottom: 30%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(180deg);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            backdrop-filter: blur(10px);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .capybara-container {
            width: 220px;
            height: 180px;
            margin: 0 auto 20px;
            position: relative;
            animation: float-butterfly 3s ease-in-out infinite;
            filter: drop-shadow(3px 3px 8px rgba(0,0,0,0.2));
        }

        @keyframes float-butterfly {
            0%, 100% {
                transform: translateY(0px) rotate(-2deg);
            }
            50% {
                transform: translateY(-15px) rotate(2deg);
            }
        }

        .capybara {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Cuerpo estilo dibujado a mano */
        .butterfly-body {
            width: 14px;
            height: 90px;
            background: #2c2c2c;
            position: absolute;
            z-index: 5;
            border-radius: 40% 40% 50% 50%;
            transform: rotate(1deg);
        }

        .butterfly-body::before {
            content: '';
            width: 22px;
            height: 22px;
            background: #1a1a1a;
            border-radius: 60% 40% 50% 50%;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(-3deg);
        }

        .butterfly-body::after {
            content: '';
            width: 16px;
            height: 16px;
            background: #2c2c2c;
            border-radius: 50%;
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Segmentos del cuerpo - estilo dibujado */
        .body-segment {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #444;
            left: 0;
        }

        .body-segment:nth-child(1) { top: 20%; }
        .body-segment:nth-child(2) { top: 35%; }
        .body-segment:nth-child(3) { top: 50%; }
        .body-segment:nth-child(4) { top: 65%; }

        /* Antenas dibujadas a mano */
        .antenna {
            width: 3px;
            height: 30px;
            background: #1a1a1a;
            position: absolute;
            top: -28px;
            left: 50%;
            border-radius: 2px;
        }

        .antenna.left {
            transform: translateX(-5px) rotate(-35deg);
            transform-origin: bottom;
        }

        .antenna.right {
            transform: translateX(5px) rotate(35deg);
            transform-origin: bottom;
        }

        .antenna::after {
            content: '';
            width: 7px;
            height: 7px;
            background: #2c2c2c;
            border-radius: 50%;
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Alas con estilo dibujado a mano */
        .wing {
            position: absolute;
            animation: wing-flap-sketch 2.5s ease-in-out infinite;
        }

        .wing.left {
            right: 52%;
            transform-origin: right center;
        }

        .wing.right {
            left: 52%;
            transform-origin: left center;
        }

        @keyframes wing-flap-sketch {
            0%, 100% {
                transform: rotateY(0deg) rotate(0deg);
            }
            25% {
                transform: rotateY(15deg) rotate(-2deg);
            }
            75% {
                transform: rotateY(15deg) rotate(2deg);
            }
        }

        /* Ala superior - trazos irregulares */
        .wing-top {
            width: 95px;
            height: 85px;
            background: #FF6B35;
            position: relative;
            border-radius: 45% 55% 30% 70% / 60% 40% 60% 40%;
            border: 3px solid #1a1a1a;
            transform: rotate(-10deg);
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.15);
        }

        .wing.right .wing-top {
            border-radius: 55% 45% 70% 30% / 40% 60% 40% 60%;
            transform: rotate(10deg) scaleX(-1);
        }

        /* Líneas internas dibujadas */
        .wing-vein {
            position: absolute;
            background: #1a1a1a;
            opacity: 0.3;
        }

        .wing-vein.v1 {
            width: 2px;
            height: 50px;
            top: 10px;
            left: 30px;
            transform: rotate(20deg);
        }

        .wing-vein.v2 {
            width: 2px;
            height: 45px;
            top: 15px;
            left: 50px;
            transform: rotate(-15deg);
        }

        .wing-vein.v3 {
            width: 2px;
            height: 40px;
            top: 20px;
            right: 20px;
            transform: rotate(30deg);
        }

        /* Manchas orgánicas */
        .wing-top::before {
            content: '';
            width: 28px;
            height: 28px;
            background: #FFF;
            border-radius: 60% 40% 55% 45%;
            position: absolute;
            top: 25px;
            left: 28px;
            border: 2px solid #1a1a1a;
            opacity: 0.9;
        }

        .wing-top::after {
            content: '';
            width: 22px;
            height: 22px;
            background: #FFE4B5;
            border-radius: 45% 55% 60% 40%;
            position: absolute;
            bottom: 20px;
            left: 25px;
            border: 2px solid #1a1a1a;
            opacity: 0.9;
        }

        .wing-pattern {
            position: absolute;
            background: #1a1a1a;
            border-radius: 50%;
        }

        .wing-pattern.spot1 {
            width: 10px;
            height: 10px;
            top: 18px;
            right: 25px;
        }

        .wing-pattern.spot2 {
            width: 8px;
            height: 8px;
            top: 40px;
            right: 18px;
        }

        .wing-pattern.spot3 {
            width: 12px;
            height: 9px;
            bottom: 22px;
            left: 35px;
            border-radius: 50% 50% 40% 60%;
        }

        /* Ala inferior - trazo orgánico */
        .wing-bottom {
            width: 72px;
            height: 65px;
            background: #FFA500;
            border-radius: 30% 70% 70% 50% / 40% 50% 80% 60%;
            position: absolute;
            top: 70px;
            left: 12px;
            border: 3px solid #1a1a1a;
            transform: rotate(-8deg);
            box-shadow: inset -4px -4px 12px rgba(0,0,0,0.15);
        }

        .wing.right .wing-bottom {
            border-radius: 70% 30% 50% 70% / 50% 40% 60% 80%;
            transform: rotate(8deg) scaleX(-1);
        }

        .wing-bottom::before {
            content: '';
            width: 20px;
            height: 20px;
            background: #FFF;
            border-radius: 55% 45% 60% 40%;
            position: absolute;
            top: 22px;
            left: 22px;
            border: 2px solid #1a1a1a;
            opacity: 0.9;
        }

        .wing-bottom::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #1a1a1a;
            border-radius: 50%;
            position: absolute;
            bottom: 18px;
            right: 18px;
        }

        /* Borde decorativo en ala inferior */
        .wing-edge {
            width: 8px;
            height: 8px;
            background: #1a1a1a;
            border-radius: 50%;
            position: absolute;
            bottom: 8px;
            left: 35px;
        }

        .gear-small {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF6B35 0%, #FFA500 100%);
            position: absolute;
            bottom: -5px;
            right: 15px;
            animation: rotate 3s linear infinite;
            opacity: 0.7;
            z-index: 1;
            border: 2px solid rgba(0,0,0,0.2);
        }

        .gear-small::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .agency-name {
            font-size: 2.2em;
            font-weight: 700;
            background: linear-gradient(135deg, #FF6B35 0%, #FFA500 50%, #FF6B35 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -1px;
            text-shadow: 2px 2px 4px rgba(255,107,53,0.1);
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .time-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 15px 20px;
            min-width: 80px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-5px);
        }

        .time-value {
            font-size: 2em;
            font-weight: bold;
            color: white;
            line-height: 1;
        }

        .time-label {
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }

        p {
            font-size: 1.1em;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 30px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% {
                width: 0%;
            }
            50% {
                width: 70%;
            }
            100% {
                width: 100%;
            }
        }

        .social-links {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-links a {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .social-links a:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .email {
            color: #764ba2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .email:hover {
            color: #667eea;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            p {
                font-size: 1em;
            }
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="container">
        <div class="capybara-container">
            <div class="capybara">
                <div class="wing left">
                    <div class="wing-top">
                        <div class="wing-vein v1"></div>
                        <div class="wing-vein v2"></div>
                        <div class="wing-vein v3"></div>
                        <div class="wing-pattern spot1"></div>
                        <div class="wing-pattern spot2"></div>
                        <div class="wing-pattern spot3"></div>
                    </div>
                    <div class="wing-bottom">
                        <div class="wing-edge"></div>
                    </div>
                </div>
                
                <div class="butterfly-body">
                    <div class="body-segment"></div>
                    <div class="body-segment"></div>
                    <div class="body-segment"></div>
                    <div class="body-segment"></div>
                    <div class="antenna left"></div>
                    <div class="antenna right"></div>
                </div>
                
                <div class="wing right">
                    <div class="wing-top">
                        <div class="wing-vein v1"></div>
                        <div class="wing-vein v2"></div>
                        <div class="wing-vein v3"></div>
                        <div class="wing-pattern spot1"></div>
                        <div class="wing-pattern spot2"></div>
                        <div class="wing-pattern spot3"></div>
                    </div>
                    <div class="wing-bottom">
                        <div class="wing-edge"></div>
                    </div>
                </div>
                
                <div class="gear-small"></div>
            </div>
        </div>
        
        <div class="agency-name">Mariposadigital</div>
        
        <h1>Estamos en Mantenimiento</h1>
        
        <p>
            Estamos trabajando para mejorar tu experiencia. 
            Nuestro sitio volverá pronto con nuevas características increíbles.
        </p>
        
        <div class="countdown">
            <div class="time-box">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Días</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Horas</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutos</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Segundos</div>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <p>
            ¿Necesitas contactarnos?<br>
            <a href="mailto:contacto@tuempresa.com" class="email">contacto@tuempresa.com</a>
        </p>
        
        <div class="social-links">
            <a href="#" title="Facebook">f</a>
            <a href="#" title="Twitter">𝕏</a>
            <a href="#" title="Instagram">📷</a>
            <a href="#" title="LinkedIn">in</a>
        </div>
    </div>

    <script>
        // Establecer fecha objetivo (3 días desde ahora)
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 3);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            if (distance < 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
            }
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
